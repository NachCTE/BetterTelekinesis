; BetterTelekinesis.ini — default configuration
; Place at: Data/SKSE/Plugins/BetterTelekinesis.ini
; All distances in Skyrim units (1 unit ≈ 1 inch).
; Changes take effect after reloading via MCM "Apply" or game restart.

[Targeting]
fMaxGrabDistance=2000.0
fConeHalfAngleDeg=15.0
fPullSpeed=3500.0

[Hold]
fHoldDistance=150.0
fOrbitRadius=90.0
fSpringConstant=120.0
fDampingCoefficient=14.0
fMaxHoldSpeed=800.0
iMaxObjects=5
; 0 = hold button to maintain grip, 1 = press to toggle
bHoldToggleMode=0

[Throw]
fThrowBaseForce=5000.0
; Multiplier at full charge (2x = double force at max charge)
fThrowChargeMax=3.0
; Seconds to reach full charge
fThrowChargeTime=2.0

[Damage]
fDamageScalar=0.05
fMinDamage=1.0
fMaxDamage=200.0
; Damage above this threshold staggers the hit enemy
fStaggerThreshold=40.0
; Objects heavier than this (Skyrim lbs) always stagger
fHeavyObjectMass=15.0
; 1 = damage followers and allies, 0 = safe mode
bFriendlyFire=0

[Shield]
bOrbitShieldEnabled=1
fInterceptRadius=130.0
; Probability [0.0-1.0] to block a projectile
fInterceptChance=0.75

[Magicka]
; Magicka per second with 1 object held
fMagickaCostBase=4.0
; Cost multiplier per additional object: cost = base * perObj^(count-1)
fMagickaCostPerObj=1.6

[Perks]
; Minimum Alteration skill to unlock each feature
iPerkLevelDamage=25
iPerkLevelOrbit=50
iPerkLevelCharge=75
iPerkLevelMax5=100

[Hotkeys]
; DirectInput scan codes
; 0x22 = G, 0x13 = R, 0xFF = use spell cast button
iKeyAddObject=34
iKeyDropAll=19
iKeyThrow=255

[VR]
; Half-angle tolerance for VR controller aim cone
fVRAimConeHalfDeg=20.0
